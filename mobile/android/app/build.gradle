plugins {
    id "com.android.application"
    id "kotlin-android"
    // Must come after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// Release signing is read from android/key.properties, which is gitignored.
// Without it the release build falls back to the debug key so that
// `flutter build apk --release` still produces an installable APK for testing.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "in.ac.dsvv.grievance"
    // 36 is required by androidx.core 1.18+, which the Flutter
    // plugins pull in. targetSdk stays at 34: compiling against a
    // newer API is independent of opting in to its runtime behaviour.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications for java.time on older APIs.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "in.ac.dsvv.grievance"
        // 23 is the floor for flutter_secure_storage's EncryptedSharedPreferences.
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // Left off so the first release build cannot fail on a missing
            // keep rule. Turn both on once the app has been smoke-tested.
            minifyEnabled false
            shrinkResources false
        }
        debug {
            // No applicationIdSuffix: google-services.json is keyed to the
            // exact package name, and a suffixed debug build would silently
            // lose push notifications.
            versionNameSuffix "-debug"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
