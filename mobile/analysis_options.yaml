include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # The app is a single package with no public API, so member-level docs are
    # not required - the explanatory comments are on the non-obvious parts.
    public_member_api_docs: false
    prefer_single_quotes: true
    avoid_print: true
    use_build_context_synchronously: true

analyzer:
  errors:
    # An unawaited future in a fire-and-forget path is intentional in a few
    # places (badge refresh, device registration), but should still be visible.
    unawaited_futures: warning
