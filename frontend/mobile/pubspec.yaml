name: dsvv_grievance
description: DSVV Grievance Management System - Android client for the existing backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  http_parser: ^4.0.2

  # Secure token storage (refresh token never goes to prefs)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Camera / gallery
  image_picker: ^1.1.2

  # Location + map
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Push notifications (optional at runtime - see MOBILE_API.md PUSH_ENABLED)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
